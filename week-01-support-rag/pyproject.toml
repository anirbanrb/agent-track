[project]
name = "supportrag"
version = "0.1.0"
description = "Week 1 of the agent track: a support agent that answers from documentation, cites its sources, and hands off when the docs do not cover the question."
requires-python = ">=3.11"
dependencies = [
    "openai>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
supportrag = "supportrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
